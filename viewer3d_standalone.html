<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nuage de points 3D — Monument André Cools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1628;overflow:hidden;font-family:sans-serif}
canvas{display:block;width:100vw;height:100vh}
.back{position:fixed;top:16px;right:16px;z-index:100;background:rgba(10,22,40,0.9);border:1px solid rgba(30,95,168,0.5);color:#e8f0f8;padding:8px 16px;border-radius:4px;font-size:12px;font-weight:600;text-decoration:none;text-transform:uppercase}
.back:hover{background:#1e5fa8}
.info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(10,22,40,0.85);border:1px solid rgba(30,95,168,0.3);color:#8fa3b8;padding:8px 20px;border-radius:4px;font-size:12px;text-align:center}
.stats{position:fixed;top:16px;left:16px;background:rgba(10,22,40,0.85);border:1px solid rgba(30,95,168,0.3);border-radius:4px;padding:10px 14px;font-size:11px;color:#8fa3b8;line-height:1.8}
.stats strong{color:#f0b429;font-size:13px;display:block;margin-bottom:4px}
#loading{position:fixed;inset:0;background:#0a1628;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#8fa3b8;font-size:13px;gap:16px}
#loading-bar-wrap{width:240px;height:4px;background:rgba(30,95,168,0.2);border-radius:2px}
#loading-bar{height:4px;width:0%;background:#1e5fa8;border-radius:2px;transition:width 0.2s}
</style>
</head>
<body>
<div id="loading">
  <div style="color:#f0b429;font-weight:600;font-size:14px">Monument André Cools</div>
  <div id="loading-msg">Chargement du nuage de points…</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>
<a class="back" href="viewer3d_standalone.html" target="_blank" title="Ouvrir en plein écran">⛶ Plein écran</a>
<div class="stats">
  <strong>Monument André Cools</strong>
  367 996 points · RMSE 1.529mm<br>
  Trimble X7 · 24/04/2026<br>
  Visualisation web allégée
</div>
<div class="info">Clic gauche : rotation &nbsp;|&nbsp; Molette : zoom &nbsp;|&nbsp; Clic droit : déplacer</div>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1628);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.001, 1000);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);

let spherical = {theta:-0.8, phi:1.1, radius:10};
let target = new THREE.Vector3(3,-1,1);
let isDrag=false, isRight=false, prev={x:0,y:0};

function updateCam(){
  camera.position.set(
    target.x + spherical.radius*Math.sin(spherical.phi)*Math.sin(spherical.theta),
    target.y + spherical.radius*Math.sin(spherical.phi)*Math.cos(spherical.theta),
    target.z + spherical.radius*Math.cos(spherical.phi)
  );
  camera.lookAt(target);
  camera.up.set(0,0,1);
}
updateCam();

const c = document.getElementById('c');
c.addEventListener('mousedown',e=>{if(e.button===0)isDrag=true;if(e.button===2)isRight=true;prev={x:e.clientX,y:e.clientY};});
c.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mouseup',()=>{isDrag=false;isRight=false;});
window.addEventListener('mousemove',e=>{
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  if(isDrag){spherical.theta-=dx*0.005;spherical.phi=Math.max(0.1,Math.min(Math.PI-0.1,spherical.phi+dy*0.005));}
  if(isRight){
    const right=new THREE.Vector3();
    right.crossVectors(new THREE.Vector3().subVectors(camera.position,target).normalize(),new THREE.Vector3(0,0,1)).normalize();
    target.addScaledVector(right,-dx*0.01);
    target.z+=dy*0.01;
  }
  prev={x:e.clientX,y:e.clientY};
  updateCam();
});
c.addEventListener('wheel',e=>{spherical.radius=Math.max(2,Math.min(50,spherical.radius+e.deltaY*0.02));updateCam();e.preventDefault();},{passive:false});

// Chargement externe du nuage de points
const bar = document.getElementById('loading-bar');
const msg = document.getElementById('loading-msg');

fetch('data/nuage_cools.bin')
  .then(res => {
    const total = parseInt(res.headers.get('Content-Length') || '0');
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    function pump(){
      return reader.read().then(({done, value}) => {
        if(done) return;
        chunks.push(value);
        received += value.length;
        if(total) bar.style.width = Math.round(received/total*100)+'%';
        return pump();
      });
    }
    return pump().then(() => {
      const buf = new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));
      let offset=0;
      for(const chunk of chunks){buf.set(chunk,offset);offset+=chunk.length;}
      return buf.buffer;
    });
  })
  .then(buf => {
    msg.textContent = 'Construction de la scène…';
    bar.style.width = '100%';
    const floats = new Float32Array(buf);
    const n = floats.length / 6;
    const pos = new Float32Array(n*3);
    const col = new Float32Array(n*3);
    for(let i=0;i<n;i++){
      pos[i*3]=floats[i*6]; pos[i*3+1]=floats[i*6+1]; pos[i*3+2]=floats[i*6+2];
      col[i*3]=floats[i*6+3]; col[i*3+1]=floats[i*6+4]; col[i*3+2]=floats[i*6+5];
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));
    const mat = new THREE.PointsMaterial({size:0.03, vertexColors:true, sizeAttenuation:true});
    scene.add(new THREE.Points(geo, mat));
    document.getElementById('loading').style.display='none';
  })
  .catch(err => {
    msg.textContent = 'Erreur de chargement : ' + err.message;
    bar.style.background = '#ff4444';
  });

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);})();
</script>
</body>
</html>
